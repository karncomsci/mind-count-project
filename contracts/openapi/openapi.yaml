openapi: 3.1.0
info:
  title: Mind Count API
  version: 0.1.0
  description: Phase 0 infrastructure contract. Authentication is added in Phase 1.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the HTTP process is alive
      responses:
        '200':
          $ref: '#/components/responses/HealthResult'
        default:
          $ref: '#/components/responses/Failure'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether PostgreSQL is reachable within the readiness deadline
      responses:
        '200':
          $ref: '#/components/responses/HealthResult'
        '503':
          $ref: '#/components/responses/Failure'
        default:
          $ref: '#/components/responses/Failure'
components:
  headers:
    RequestId:
      description: Server-generated correlation ID
      required: true
      schema:
        type: string
        format: uuid
  responses:
    HealthResult:
      description: Healthy
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Failure:
      description: Request failed
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          format: uuid
