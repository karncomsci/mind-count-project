name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.14
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and pinned tools
        run: |
          pnpm install --frozen-lockfile
          make tools
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Unit tests
        run: make test
      - name: PostgreSQL 18 integration tests
        run: make test-integration
      - name: Generated code diff check
        run: |
          pnpm check:generated
          git diff --exit-code -- apps/api/internal/db/gen apps/api/internal/transport/http/openapi apps/web/app/lib/api/generated
      - name: Build
        run: make build
      - name: Compose smoke
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          make dev
          make migrate-up
          curl --fail --max-time 5 http://localhost:8080/health/ready
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Compose logs
        if: always()
        run: |
          mkdir -p _wrx-output/evidence
          docker compose logs --no-color > _wrx-output/evidence/compose.log
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence
          path: _wrx-output/
      - name: Stop services
        if: always()
        run: docker compose down
